<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>透明度与光标类型</title>
    <style>
        div {
            width: 600px;
            height: 300px;
            background-color: pink;

            opacity: 0.78;
            /* 光标变换 手 工字型 十字光标*/
            /* cursor: pointer; */
            /* cursor: text; */
            cursor: move;

        }

        img {
            width: 300px;
            height: 200px;
        }
    </style>
</head>
<body>
   <div>
    <img src="./images/QQ图片20201128011318.jpg" alt="">
   </div> 
</body>
</html>
